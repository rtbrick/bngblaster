name: Docker

# Container image with BNG Blaster and controller (docker/Dockerfile).
#
# ghcr.io/rtbrick/bngblaster:dev       latest commit on the dev branch
# ghcr.io/rtbrick/bngblaster:<version> release
# ghcr.io/rtbrick/bngblaster:latest    latest release (never set by dev)
on:
  push:
    branches:
      - dev
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
    # Path filters apply to branch pushes only, releases are always built.
    paths-ignore:
      - 'docs/**'
      - 'docsrc/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Docker Image
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v6

    - name: Image Tags
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository_owner }}/bngblaster
        flavor: latest=false
        tags: |
          type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
          type=ref,event=tag
          type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Manually triggered builds of other branches are built but not pushed.
    - name: Build and Push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/Dockerfile
        platforms: linux/amd64
        push: ${{ steps.meta.outputs.tags != '' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          BNGBLASTER_VERSION=${{ github.ref_type == 'tag' && github.ref_name || '' }}
          GIT_REF=${{ github.ref_name }}
          GIT_SHA=${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
