name: Integration

on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  BUILD_TYPE: RelWithDebInfo
  # GoBGP master with TCP-AO support (osrg/gobgp#3602), not released yet
  GOBGP_COMMIT: 15e9be9198ae51abad50b3d9b42aa63c3b462834
  # FRR major release track for ISIS and OSPF tests
  FRR_VERSION: frr-10

jobs:
  integration:
    name: Integration Tests
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v6

    - name: Install RtBrick libdict
      shell: bash
      run: |
        wget https://github.com/rtbrick/libdict/releases/download/1.0.6/libdict-ubuntu-24.04.zip
        unzip libdict-ubuntu-24.04.zip
        sudo dpkg -i libdict_1.0.6_amd64.deb libdict-dev_1.0.6_amd64.deb

    - name: Install Dependencies
      shell: bash
      run: sudo apt install -y libncurses-dev libssl-dev libjansson-dev libpcap-dev

    - name: Build
      shell: bash
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=$BUILD_TYPE
        cmake --build build --config $BUILD_TYPE

    - uses: actions/setup-go@v5
      with:
        go-version: '1.25'
        cache: false

    - name: Cache GoBGP
      id: gobgp-cache
      uses: actions/cache@v4
      with:
        path: ~/gobgp
        key: gobgp-${{ env.GOBGP_COMMIT }}

    - name: Build GoBGP
      if: steps.gobgp-cache.outputs.cache-hit != 'true'
      shell: bash
      run: GOBIN=$HOME/gobgp go install github.com/osrg/gobgp/v4/cmd/...@$GOBGP_COMMIT

    - name: Install FRR
      shell: bash
      run: |
        curl -s https://deb.frrouting.org/frr/keys.gpg | sudo tee /usr/share/keyrings/frrouting.gpg > /dev/null
        echo "deb [signed-by=/usr/share/keyrings/frrouting.gpg] https://deb.frrouting.org/frr $(lsb_release -s -c) $FRR_VERSION" \
          | sudo tee /etc/apt/sources.list.d/frr.list
        sudo apt update
        sudo apt install -y frr
        # FRR daemons are started per test in network namespaces.
        sudo systemctl stop frr

    - name: Install BIRD
      shell: bash
      run: |
        sudo apt install -y bird2
        # BIRD is started per test in network namespaces.
        sudo systemctl stop bird

    - name: Install Python Dependencies
      shell: bash
      run: |
        python3 -m venv $RUNNER_TEMP/venv
        $RUNNER_TEMP/venv/bin/pip install -r test/integration/requirements.txt

    - name: Integration Tests
      shell: bash
      env:
        GOBGPD_BIN: /home/runner/gobgp/gobgpd
        GOBGP_BIN: /home/runner/gobgp/gobgp
        BBL_REQUIRE_TCP_MD5: 1
        BBL_REQUIRE_TCP_AO: 1
        BBL_REQUIRE_FRR: 1
        BBL_REQUIRE_BIRD: 1
      run: |
        uname -r
        grep -E "CONFIG_TCP_(AO|MD5SIG)=" /boot/config-$(uname -r) || true
        sudo -E $RUNNER_TEMP/venv/bin/python -m pytest -v test/integration --basetemp=$RUNNER_TEMP/bbl-it

    - name: Make Test Artifacts Readable
      if: failure()
      run: sudo chmod -R a+rX $RUNNER_TEMP/bbl-it

    - name: Upload Test Artifacts
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: integration-artifacts
        path: ${{ runner.temp }}/bbl-it
